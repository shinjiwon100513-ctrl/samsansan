<style>
:root{--ink:#202722;--muted:#737b75;--line:#e5e9e5;--soft:#f6f8f6;--green:#356b4b;--green2:#eaf2ec;--danger:#b43c3c}

header{border-bottom:1px solid var(--line);background:#fff}.wrap{max-width:1100px;margin:auto;padding:0 24px}.top{height:78px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:19px;font-weight:750;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:5px;letter-spacing:0}
.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 14px;font-weight:650;color:var(--ink)}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn:hover{filter:brightness(.97)}.btn.danger{color:var(--danger);border-color:#f0d5d5}
main{padding-top:36px;padding-bottom:70px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}.eyebrow{color:var(--green);font-size:12px;font-weight:750;letter-spacing:1px}.intro h1{font-size:30px;letter-spacing:-1px;margin:9px 0}.intro p{color:var(--muted);margin:0;font-size:14px}.actions{display:flex;gap:9px;flex-wrap:wrap}
.stats{display:flex;gap:12px;margin:26px 0}.stat{border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:145px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin-top:7px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:30px 0 15px}.toolbar h2{font-size:17px;margin:0}.filters{display:flex;gap:8px}.searchbox{width:230px;border:1px solid var(--line);border-radius:9px;padding:10px 12px}.select{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:13px;overflow:hidden;transition:border .15s;cursor:pointer}.card:hover{border-color:#a9c1af}.photo{height:150px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:#929a94;font-size:13px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.cardbody{padding:16px}.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:start}.card h3{font-size:16px;margin:0 0 6px}.latin{font-size:12px;color:var(--muted);margin-bottom:14px}.pill{font-size:11px;background:var(--green2);color:var(--green);border-radius:20px;padding:5px 8px;white-space:nowrap}.bloomline{border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:12px}.bloomline strong{display:block;color:var(--ink);font-size:13px;margin-top:5px}.empty{border:1px dashed #d9dfda;border-radius:13px;padding:52px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--ink);margin-bottom:8px}.empty button{margin-top:18px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px;padding:20px 0}.syncstatus{font-size:12px;color:var(--muted);padding:8px 0 0}.syncstatus strong{font-weight:650}.syncstatus.ok{color:#356b4b}.syncstatus.err{color:#b43c3c}
.overlay{display:none;position:fixed;inset:0;background:rgba(20,30,23,.32);z-index:5;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(600px,100%);max-height:92vh;overflow:auto;padding:24px}.modal.wide{width:min(720px,100%)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.modalhead h2{font-size:20px;margin:0}.x{border:0;background:var(--soft);border-radius:8px;width:34px;height:34px;font-size:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:650}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe4df;border-radius:8px;padding:11px;background:#fff}.field textarea{min-height:86px;resize:vertical}.hint{font-size:11px;color:var(--muted);font-weight:400}.modalactions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.rightactions{display:flex;gap:8px}.preview{width:100%;height:150px;border:1px dashed #d6ddd7;background:var(--soft);border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:13px}.preview img{width:100%;height:100%;object-fit:cover}.detailhero{display:flex;gap:18px;align-items:center;margin-bottom:20px}.detailhero .photo{width:150px;height:125px;border-radius:10px;flex-shrink:0}.detailhero h2{margin:0 0 7px}.detailhero p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}.sectiontitle{font-size:14px;margin:22px 0 10px}.chartbox{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0 22px;overflow:hidden}.charttitle{font-size:14px;font-weight:700;margin:0 0 4px}.chartnote{font-size:12px;color:var(--muted);margin:0 0 16px}.monthaxis{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;margin:0 0 10px;padding-left:66px;color:var(--muted);font-size:10px;text-align:center}.yearrow{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center;margin:10px 0}.yearlabel{font-size:12px;color:var(--muted)}.monthtrack{height:24px;position:relative;border-radius:5px;background:repeating-linear-gradient(to right,#f7f8f7 0,#f7f8f7 calc(8.333% - 1px),#e8ece8 calc(8.333% - 1px),#e8ece8 8.333%)}.monthdot{position:absolute;top:5px;width:14px;height:14px;border:2px solid #fff;border-radius:50%;background:var(--green);transform:translateX(-50%);box-shadow:0 0 0 1px var(--green)}.bloomtable{width:100%;border-collapse:collapse;font-size:13px}.bloomtable th,.bloomtable td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line)}.bloomtable th{color:var(--muted);font-weight:600}.muted{color:var(--muted)}.hidden{display:none!important}

.calendar-open{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:var(--green);flex-shrink:0}.calendar-open:hover{background:var(--green2)}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}.calendar-month{font-size:18px;font-weight:750}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.calendar-weekday{text-align:center;color:var(--muted);font-size:12px;padding:7px 0}.calendar-day{min-height:58px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 3px;text-align:center;color:var(--ink);font-size:13px;position:relative}.calendar-day.muted-day{opacity:.35}.calendar-day.selected{border:2px solid var(--green);background:var(--green2)}.calendar-day.today{font-weight:800}.calendar-day.has-events:after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--green)}.calendar-entry{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:7px 0;display:flex;justify-content:space-between;gap:10px;align-items:start}.calendar-entry strong{font-size:13px}.calendar-entry p{font-size:13px;margin:4px 0 0;color:var(--muted);white-space:pre-wrap}.calendar-form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.calendar-form .field.full{grid-column:1/-1}.calendar-form input,.calendar-form textarea,.calendar-form select{width:100%;border:1px solid #dfe4df;border-radius:8px;padding:10px;background:#fff}.calendar-form textarea{min-height:65px;resize:vertical}.calendar-empty{font-size:13px;color:var(--muted);padding:12px 0}
@media(max-width:430px){.calendar-day{min-height:46px;padding:5px 2px}.calendar-form{grid-template-columns:1fr}.calendar-form .field.full{grid-column:auto}}
@media(max-width:700px){.wrap{padding:0 16px}.top{height:70px}.intro{align-items:start;flex-direction:column}.intro h1{font-size:26px}.stats{gap:8px}.stat{min-width:0;flex:1;padding:13px}.stat strong{font-size:20px}.toolbar{align-items:start;flex-direction:column}.filters{width:100%}.searchbox{width:100%;min-width:0;flex:1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:120px}.cardbody{padding:12px}.pill{display:none}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.detailhero{align-items:start;flex-direction:column}.detailhero .photo{width:100%;height:180px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.card{display:grid;grid-template-columns:110px 1fr}.card .photo{height:100%;min-height:135px}.cardbody{padding:12px}.actions .btn{padding:9px 11px}}
</style>

<body>
<header><div class="wrap top"><div class="brand">삼산고 식물 기록<small>SAMSAN HIGH SCHOOL · BLOOM ARCHIVE</small></div></div></header>
<main class="wrap">
<section class="intro"><div><div class="eyebrow">SCHOOL PLANT ARCHIVE</div><h1>우리 학교의 개화 기록</h1><p>학교에서 자라는 식물과 해마다 피어난 시기를 기록해요.</p></div><div class="actions"><button class="btn" id="searchOpen">⌕ 식물 검색</button><button class="btn primary" id="addOpen">＋ 식물 등록</button></div></section>
<div class="stats"><div class="stat"><span>등록 식물</span><strong id="plantCount">0</strong></div><div class="stat"><span>개화 기록</span><strong id="bloomCount">0</strong></div><div class="stat"><span>기록 연도</span><strong id="yearCount">0</strong></div></div>
<div class="toolbar"><h2>식물 목록 <span class="muted" id="listCount"></span></h2><div class="filters"><input class="searchbox" id="quickSearch" placeholder="식물 이름 검색" aria-label="식물 이름 검색"></div></div>
<div class="grid" id="plantGrid"></div>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px"><button class="btn" id="syncNow" type="button">지금 동기화</button><div id="syncStatus" class="syncstatus">온라인 저장소에 연결하는 중…</div></div>
</main>
<footer><div class="wrap">삼산고등학교 식물 개화 기록 · Google 스프레드시트와 동기화합니다.</div></footer>
<div class="overlay" id="plantModal"><div class="modal"><div class="modalhead"><h2 id="plantModalTitle">식물 등록</h2><button class="x" data-close="plantModal">×</button></div>
<form id="plantForm"><div class="formgrid">
<div class="field full"><label>식물 사진 한 장 <span class="hint">(선택)</span></label><div class="preview" id="photoPreview">사진을 선택하면 여기에 표시됩니다.</div><input type="file" id="plantPhoto" accept="image/*"></div>
<div class="field full"><label for="plantName">식물 이름 *</label><input id="plantName" required maxlength="100" placeholder="예: 벚나무"></div>
<div class="field full"><label for="plantBasic">기본 정보 <span class="hint">(선택)</span></label><textarea id="plantBasic" placeholder="학명, 특징, 위치, 관리 정보 등"></textarea></div>
</div><div class="modalactions"><span></span><div class="rightactions"><button type="button" class="btn" data-close="plantModal">취소</button><button class="btn primary" type="submit">저장</button></div></div></form></div></div>
<div class="overlay" id="searchModal"><div class="modal"><div class="modalhead"><h2>식물 검색</h2><button class="x" data-close="searchModal">×</button></div><div class="field"><label for="modalSearch">식물 이름</label><input id="modalSearch" placeholder="이름을 입력하세요"></div><div id="searchResults" style="margin-top:14px"></div></div></div>
<div class="overlay" id="detailModal"><div class="modal wide"><div class="modalhead"><h2>식물 상세 정보</h2><button class="x" data-close="detailModal">×</button></div><div id="detailContent"></div></div></div>
<div class="overlay" id="bloomModal"><div class="modal"><div class="modalhead"><h2 id="bloomTitle">개화 기록 추가</h2><button class="x" data-close="bloomModal">×</button></div><form id="bloomForm"><div class="formgrid"><div class="field"><label for="bloomYear">연도 *</label><input type="number" id="bloomYear" min="1900" max="2200" required></div><div class="field"><label for="bloomDate">개화일</label><input type="date" id="bloomDate"></div><div class="field full"><label for="bloomPeriod">개화 시기</label><input id="bloomPeriod" placeholder="예: 4월 초, 4월 10일경"></div><div class="field full"><label for="bloomNote">메모 <span class="hint">(선택)</span></label><textarea id="bloomNote" placeholder="날씨, 관찰 장소, 꽃 상태 등"></textarea></div></div><div class="modalactions"><span></span><div class="rightactions"><button type="button" class="btn" data-close="bloomModal">취소</button><button class="btn primary" type="submit">기록 저장</button></div></div></form></div></div>
<div class="overlay" id="calendarModal"><div class="modal wide"><div class="modalhead"><h2 id="calendarTitle">식물 관찰 달력</h2><button class="x" data-close="calendarModal">×</button></div><div class="calendar-head"><button class="btn" type="button" onclick="changeCalendarMonth(-1)">‹ 이전 달</button><div class="calendar-month" id="calendarMonthLabel"></div><button class="btn" type="button" onclick="changeCalendarMonth(1)">다음 달 ›</button></div><div class="calendar-grid" id="calendarGrid"></div><h3 class="sectiontitle" id="calendarSelectedLabel"></h3><div id="calendarEntries"></div><form id="calendarForm" class="calendar-form"><div class="field"><label for="calendarDate">날짜</label><input type="date" id="calendarDate" required></div><div class="field"><label for="calendarType">기록 종류</label><select id="calendarType"><option>물 주기</option><option>파종</option><option>심기</option><option>비료 주기</option><option>가지치기</option><option>병충해 관찰</option><option>개화 관찰</option><option>기타</option></select></div><div class="field full"><label for="calendarNote">간단한 메모</label><textarea id="calendarNote" maxlength="500" placeholder="예: 흙이 말라 물을 충분히 줌"></textarea></div><div class="field full" style="display:flex;align-items:end"><button class="btn primary" type="submit">이 날짜에 기록 저장</button></div></form></div></div>

<script>
const KEY='samsanBloomArchive_v1';
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwLBt2amLDniRDgHDYn3upVPTfCoSCRe-FWrkyx3K5-EXQZ4rfQe5TN0wUP-jjgCblt/exec';
const MIGRATION_KEY='samsanBloomSheetsMigration_v1';
let cloudReady=false, applyingRemote=false, saveTimer=null, pollTimer=null, saveInFlight=false, dirty=false;
let plants=load(), editingPlant=null, activePlant=null, photoData='';

function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function setSyncStatus(msg,kind=''){const el=document.getElementById('syncStatus');if(el){el.textContent=msg;el.className='syncstatus '+kind}}

function mergePlants(cloud, local){
  const merged = new Map((cloud || []).map(p => [String(p.id), {
    ...p,
    blooms: Array.isArray(p.blooms) ? p.blooms : [],
    activities: Array.isArray(p.activities) ? p.activities : []
  }]));

  for(const lp of (local || [])){
    const id = String(lp.id);
    if(!merged.has(id)){
      merged.set(id, {
        ...lp,
        blooms: Array.isArray(lp.blooms) ? lp.blooms : [],
        activities: Array.isArray(lp.activities) ? lp.activities : []
      });
      continue;
    }
    const cp = merged.get(id);
    const bm = new Map((cp.blooms || []).map(b => [String(b.id), b]));
    for(const b of (lp.blooms || [])) if(!bm.has(String(b.id))) bm.set(String(b.id), b);
    
    const am = new Map((cp.activities || []).map(a => [String(a.id), a]));
    for(const a of (lp.activities || [])) if(!am.has(String(a.id))) am.set(String(a.id), a);
    
    merged.set(id, {
      ...cp,
      ...lp,
      blooms: [...bm.values()],
      activities: [...am.values()]
    });
  }
  return [...merged.values()];
}

function jsonpRead(){
  return new Promise((resolve,reject)=>{
    const cb='samsanCallback_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const timeout=setTimeout(()=>{cleanup();reject(new Error('응답 시간이 초과되었습니다.'))},15000);
    function cleanup(){clearTimeout(timeout);delete window[cb];script.remove()}
    window[cb]=data=>{
      cleanup();
      if(data && data.success && Array.isArray(data.plants)) {
        const parsedPlants = data.plants.map(p => {
          let item = p;
          if (typeof p.data === 'string') {
            try { item = JSON.parse(p.data); } catch(e) { item = p; }
          }
          return {
            ...item,
            blooms: Array.isArray(item.blooms) ? item.blooms : [],
            activities: Array.isArray(item.activities) ? item.activities : []
          };
        });
        resolve(parsedPlants);
      } else reject(new Error('저장소 응답 형식을 확인해 주세요.'));
    };
    script.onerror=()=>{cleanup();reject(new Error('저장소에 연결할 수 없습니다.'))};
    script.src=SCRIPT_URL+'?callback='+encodeURIComponent(cb)+'&t='+Date.now();
    document.body.appendChild(script);
  });
}

function postPlantsForm(plantsToSave){
  return new Promise((resolve,reject)=>{
    const frame=document.createElement('iframe');
    frame.name='samsanPostFrame_'+Date.now();
    frame.style.display='none';
    frame.setAttribute('aria-hidden','true');
    const form=document.createElement('form');
    form.method='POST'; form.action=SCRIPT_URL; form.target=frame.name;
    form.acceptCharset='UTF-8'; form.style.display='none';
    const input=document.createElement('input');
    input.type='hidden'; input.name='payload';
    input.value=JSON.stringify({plants:plantsToSave});
    form.appendChild(input); document.body.appendChild(frame); document.body.appendChild(form);
    let finished=false;
    const cleanup=()=>{form.remove();frame.remove()};
    const timer=setTimeout(()=>{if(finished)return;finished=true;cleanup();reject(new Error('저장 요청 시간이 초과되었습니다.'))},20000);
    form.submit();
    setTimeout(()=>{
      if(finished)return;
      finished=true;clearTimeout(timer);cleanup();resolve();
    },1800);
  });
}

async function cloudSave(){
  if(!cloudReady||applyingRemote||saveInFlight)return;
  saveInFlight=true;dirty=false;
  const snapshot=JSON.stringify(plants);
  try{
    await postPlantsForm(JSON.parse(snapshot));
    setSyncStatus('클라우드 저장 확인 완료 · 다른 기기와 동기화 중','ok');
  }catch(e){
    dirty=true;setSyncStatus('클라우드 저장 실패: '+e.message,'err');
  }finally{
    saveInFlight=false;
    if(dirty){clearTimeout(saveTimer);saveTimer=setTimeout(cloudSave,1800)}
  }
}

function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify(plants));render();
    if(cloudReady){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(cloudSave,500)}
    else setSyncStatus('이 기기에 임시 저장됨 · 온라인 연결을 기다리는 중');
    return true;
  }catch(e){alert('저장 공간이 부족합니다. 사진 용량을 줄인 뒤 다시 시도해 주세요.');return false}
}

function refreshOpenDetail(){
  if(activePlant){
    activePlant=plants.find(p=>p.id===activePlant.id)||null;
    if(activePlant&&document.getElementById('detailModal').classList.contains('show'))drawDetail();
  }
  if(calendarPlantId && document.getElementById('calendarModal').classList.contains('show')){
    drawCalendar();
  }
}

async function syncFromCloud(initial=false){
  if(saveInFlight||dirty)return;
  try{
    const cloudPlants=await jsonpRead();
    if(initial && cloudPlants.length===0 && plants.length>0){
      cloudReady=true; dirty=true;
      setSyncStatus('이 기기의 기존 기록을 클라우드로 옮기는 중…');
      await cloudSave();
      localStorage.setItem(MIGRATION_KEY,'1');
    }else{
      const merged = mergePlants(cloudPlants, plants);
      const currentSnapshot = JSON.stringify(plants);
      const mergedSnapshot = JSON.stringify(merged);
      
      if(mergedSnapshot !== currentSnapshot){
        applyingRemote = true;
        plants = merged;
        localStorage.setItem(KEY, JSON.stringify(plants));
        render();
        refreshOpenDetail();
        applyingRemote = false;
        
        dirty = true;
        await cloudSave();
        setSyncStatus('다른 기기의 변경 사항과 동기화 완료', 'ok');
      } else if(!cloudReady) {
        setSyncStatus('온라인 저장소 연결 완료 · 자동 동기화 중', 'ok');
      }
      cloudReady = true;
    }
  }catch(e){
    cloudReady=false;applyingRemote=false;
    setSyncStatus('온라인 연결 실패: '+e.message,'err');
  }
}

function initCloud(){
  document.getElementById('syncNow').onclick=()=>syncFromCloud(false);
  syncFromCloud(true);
  pollTimer=setInterval(()=>syncFromCloud(false),10000);
}

function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function years(){return [...new Set(plants.flatMap(p=>(p.blooms||[]).map(b=>Number(b.year))))].sort((a,b)=>b-a)}

function render(){const q=document.getElementById('quickSearch').value.trim().toLowerCase();
 const ys=years();
 document.getElementById('plantCount').textContent=plants.length;document.getElementById('bloomCount').textContent=plants.reduce((n,p)=>n+(p.blooms||[]).length,0);document.getElementById('yearCount').textContent=ys.length;
 let list=plants.filter(p=>p.name.toLowerCase().includes(q));
 document.getElementById('listCount').textContent=`(${list.length})`;
 const grid=document.getElementById('plantGrid');
 if(!list.length){grid.innerHTML=`<div class="empty"><strong>${plants.length?'검색 결과가 없습니다.':'아직 등록된 식물이 없습니다.'}</strong>${plants.length?'검색어를 바꿔 보세요.':'학교 식물을 등록하고 첫 개화 기록을 남겨 보세요.'}<br><button class="btn primary" onclick="openPlant()">＋ 식물 등록</button></div>`;return}
 grid.innerHTML=list.map(p=>{let blooms=[...(p.blooms||[])].sort((a,b)=>b.year-a.year), latest=blooms[0];return `<article class="card" onclick="openDetail('${p.id}')"><div class="photo">${p.photo?`<img src="${p.photo}" alt="${esc(p.name)}">`:'사진 없음'}</div><div class="cardbody"><div class="cardtop"><h3>${esc(p.name)}</h3><div style="display:flex;align-items:center;gap:6px"><button class="calendar-open" type="button" title="${esc(p.name)} 관찰 달력 열기" aria-label="${esc(p.name)} 관찰 달력 열기" onclick="event.stopPropagation();openCalendar('${p.id}')">▦</button><span class="pill">${blooms.length}개 기록</span></div></div><div class="latin">${esc((p.basic||'').split('\n')[0].slice(0,45)||'기본 정보 없음')}</div><div class="bloomline">최근 개화 기록<strong>${latest?`${latest.year}년 · ${esc(latest.period||latest.date||'시기 미입력')}`:'아직 개화 기록 없음'}</strong></div></div></article>`}).join('');
}

function show(id){document.getElementById(id).classList.add('show')}function hide(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)hide(o.id)}));
document.getElementById('addOpen').onclick=()=>openPlant();
document.getElementById('searchOpen').onclick=()=>{document.getElementById('modalSearch').value='';updateSearch();show('searchModal');document.getElementById('modalSearch').focus()};
document.getElementById('quickSearch').addEventListener('input',render);

function openPlant(){editingPlant=null;photoData='';document.getElementById('plantForm').reset();document.getElementById('plantModalTitle').textContent='식물 등록';document.getElementById('photoPreview').textContent='사진을 선택하면 여기에 표시됩니다.';show('plantModal')}
document.getElementById('plantPhoto').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const max=320;const scale=Math.min(1,max/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);photoData=canvas.toDataURL('image/jpeg',0.55);document.getElementById('photoPreview').innerHTML=`<img src="${photoData}" alt="선택한 사진">`;if(photoData.length>45000)alert('사진 용량이 커서 스프레드시트 저장 제한에 가까워요. 더 작은 사진을 사용해 주세요.');};img.onerror=()=>alert('사진을 읽을 수 없습니다. 다른 이미지 파일을 선택해 주세요.');img.src=r.result};r.readAsDataURL(f)});

document.getElementById('plantForm').onsubmit=e=>{
  e.preventDefault();
  const name=document.getElementById('plantName').value.trim();
  if(!name)return;
  const basic=document.getElementById('plantBasic').value.trim();
  if(editingPlant){
    editingPlant.name=name;
    editingPlant.basic=basic;
    if(photoData)editingPlant.photo=photoData;
  }else{
    plants.push({
      id:(window.crypto && typeof window.crypto.randomUUID==='function')?window.crypto.randomUUID():('plant-'+Date.now()+'-'+Math.random().toString(36).slice(2)),
      name,
      basic,
      photo:photoData,
      blooms:[],
      activities:[]
    });
  }
  if(persist())hide('plantModal');
};

function updateSearch(){const q=document.getElementById('modalSearch').value.trim().toLowerCase(), box=document.getElementById('searchResults');const found=plants.filter(p=>p.name.toLowerCase().includes(q));box.innerHTML=found.length?found.map(p=>`<button class="btn" style="display:flex;width:100%;justify-content:space-between;margin-top:8px;text-align:left" onclick="hide('searchModal');openDetail('${p.id}')"><span>${esc(p.name)}</span><span class="muted">${(p.blooms||[]).length}개 개화 기록 ›</span></button>`).join(''):'<p class="muted">일치하는 식물이 없습니다.</p>'}
document.getElementById('modalSearch').addEventListener('input',updateSearch);

function openDetail(id){activePlant=plants.find(p=>p.id===id);if(!activePlant)return;drawDetail();show('detailModal')}

let calendarPlantId=null, calendarCursor=new Date(), calendarSelectedDate='';
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function openCalendar(id){
  calendarPlantId=id;
  const p=plants.find(x=>String(x.id)===String(id));
  if(!p)return;
  calendarCursor=new Date();
  calendarSelectedDate=dateKey(calendarCursor);
  document.getElementById('calendarTitle').textContent=p.name+' · 관찰 달력';
  drawCalendar();
  show('calendarModal');
}

function changeCalendarMonth(delta){
  calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+delta,1);
  drawCalendar();
}

function drawCalendar(){
  const p=plants.find(x=>String(x.id)===String(calendarPlantId));
  if(!p)return;
  p.activities=p.activities||[];
  const y=calendarCursor.getFullYear(),m=calendarCursor.getMonth();
  document.getElementById('calendarMonthLabel').textContent=`${y}년 ${m+1}월`;
  const first=new Date(y,m,1),start=(first.getDay()),days=new Date(y,m+1,0).getDate();
  const today=dateKey(new Date());
  const names=['일','월','화','수','목','금','토'];
  let html=names.map(n=>`<div class="calendar-weekday">${n}</div>`).join('');
  
  for(let i=0;i<42;i++){
    const day=i-start+1;
    if(day<1||day>days){html+='<div></div>';continue}
    const key=dateKey(new Date(y,m,day));
    const has=p.activities.some(a=>a.date===key);
    html+=`<button type="button" class="calendar-day ${key===calendarSelectedDate?'selected':''} ${key===today?'today':''} ${has?'has-events':''}" onclick="selectCalendarDate('${key}')">${day}</button>`;
  }
  
  document.getElementById('calendarGrid').innerHTML=html;
  document.getElementById('calendarSelectedLabel').textContent=calendarSelectedDate+' 기록';
  document.getElementById('calendarDate').value=calendarSelectedDate;
  
  const entries=p.activities.filter(a=>a.date===calendarSelectedDate).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  document.getElementById('calendarEntries').innerHTML=entries.length?entries.map(a=>`<div class="calendar-entry"><div><strong>${esc(a.type||'기타')}</strong><p>${esc(a.note||'메모 없음')}</p></div><button class="btn danger" type="button" style="padding:6px 9px" onclick="deleteCalendarEntry('${a.id}')">삭제</button></div>`).join(''):'<div class="calendar-empty">이 날짜에는 아직 기록이 없어요.</div>';
}

function selectCalendarDate(key){calendarSelectedDate=key;drawCalendar()}

document.getElementById('calendarDate').addEventListener('change',e=>{
  if(!e.target.value)return;
  calendarSelectedDate=e.target.value;
  const d=new Date(e.target.value+'T12:00:00');
  calendarCursor=new Date(d.getFullYear(),d.getMonth(),1);
  drawCalendar();
});

document.getElementById('calendarForm').onsubmit=e=>{
  e.preventDefault();
  const p=plants.find(x=>String(x.id)===String(calendarPlantId));
  if(!p)return;
  const date=document.getElementById('calendarDate').value;
  if(!date)return;
  
  p.activities=p.activities||[];
  p.activities.push({
    id:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'activity-'+Date.now()+'-'+Math.random().toString(36).slice(2),
    date:date,
    type:document.getElementById('calendarType').value,
    note:document.getElementById('calendarNote').value.trim(),
    createdAt:new Date().toISOString()
  });
  
  if(persist()){
    document.getElementById('calendarNote').value='';
    calendarSelectedDate=date;
    drawCalendar();
  }
};

function deleteCalendarEntry(id){
  const p=plants.find(x=>String(x.id)===String(calendarPlantId));
  if(!p||!confirm('이 관찰 기록을 삭제할까요?'))return;
  p.activities=(p.activities||[]).filter(a=>String(a.id)!==String(id));
  persist();
  drawCalendar();
}

function monthFromBloom(b){if(b.date&&/^\d{4}-\d{2}/.test(b.date))return Number(b.date.slice(5,7));const t=String(b.period||'').toLowerCase();const korean={'1월':1,'2월':2,'3월':3,'4월':4,'5월':5,'6월':6,'7월':7,'8월':8,'9월':9,'10월':10,'11월':11,'12월':12,'일월':1,'이월':2,'삼월':3,'사월':4,'오월':5,'유월':6,'칠월':7,'팔월':8,'구월':9,'시월':10,'십일월':11,'십이월':12};for(const k in korean)if(t.includes(k))return korean[k];return null}

function drawDetail(){const p=activePlant,blooms=[...(p.blooms||[])].sort((a,b)=>b.year-a.year);const graphable=blooms.map(b=>({...b,month:monthFromBloom(b)})).filter(b=>b.month>=1&&b.month<=12);const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];const chart=graphable.length?`<div class="chartbox"><p class="charttitle">연도별 개화 시기 그래프</p><p class="chartnote">가로축은 월을 나타냅니다. 점에 마우스를 올리면 기록을 확인할 수 있어요.</p><div class="monthaxis">${months.map(m=>`<span>${m}</span>`).join('')}</div>${[...graphable].sort((a,b)=>a.year-b.year).map(b=>`<div class="yearrow"><span class="yearlabel">${b.year}년</span><div class="monthtrack"><span class="monthdot" style="left:${((b.month-.5)/12)*100}%" title="${b.year}년 · ${esc(b.period||b.date||b.month+'월')}"></span></div></div>`).join('')}</div>`:`<div class="chartbox"><p class="charttitle">연도별 개화 시기 그래프</p><p class="chartnote">월을 알아볼 수 있는 개화 시기나 개화일을 기록하면 그래프가 표시됩니다. 예: ‘4월 초’ 또는 개화일 입력.</p></div>`;document.getElementById('detailContent').innerHTML=`<div class="detailhero"><div class="photo">${p.photo?`<img src="${p.photo}" alt="${esc(p.name)}">`:'사진 없음'}</div><div><h2>${esc(p.name)}</h2><p>${esc(p.basic||'등록된 기본 정보가 없습니다.').replace(/\n/g,'<br>')}</p></div></div><div class="actions"><button class="btn primary" onclick="openBloom()">＋ 개화 기록 추가</button><button class="btn" onclick="editPlant()">정보 수정</button><button class="btn danger" onclick="deletePlant()">식물 삭제</button></div>${chart}<h3 class="sectiontitle">연도별 개화 기록 (${blooms.length})</h3>${blooms.length?`<table class="bloomtable"><thead><tr><th>연도</th><th>개화 시기</th><th>메모</th><th></th></tr></thead><tbody>${blooms.map(b=>`<tr><td>${b.year}</td><td>${esc(b.period||b.date||'미입력')}${b.date&&b.period?`<br><span class="muted">${esc(b.date)}</span>`:''}</td><td>${esc(b.note||'—')}</td><td><button class="btn danger" style="padding:6px 8px" onclick="deleteBloom('${b.id}')">삭제</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted">아직 개화 기록이 없습니다. 관찰한 시기를 추가해 보세요.</p>'}`}

function openBloom(){document.getElementById('bloomForm').reset();document.getElementById('bloomYear').value=new Date().getFullYear();document.getElementById('bloomTitle').textContent=activePlant.name+' · 개화 기록 추가';hide('detailModal');show('bloomModal')}
document.getElementById('bloomForm').onsubmit=e=>{e.preventDefault();const year=Number(document.getElementById('bloomYear').value);if(!year)return;activePlant.blooms=activePlant.blooms||[];activePlant.blooms.push({id:String(Date.now()),year,date:document.getElementById('bloomDate').value,period:document.getElementById('bloomPeriod').value.trim(),note:document.getElementById('bloomNote').value.trim()});persist();hide('bloomModal');openDetail(activePlant.id)};

function deleteBloom(id){if(!confirm('이 개화 기록을 삭제할까요?'))return;activePlant.blooms=activePlant.blooms.filter(b=>b.id!==id);persist();drawDetail()}

function editPlant(){if(!activePlant)return;editingPlant=activePlant;photoData=activePlant.photo||'';document.getElementById('plantName').value=activePlant.name||'';document.getElementById('plantBasic').value=activePlant.basic||'';document.getElementById('plantModalTitle').textContent='식물 정보 수정';document.getElementById('photoPreview').innerHTML=photoData?`<img src="${photoData}" alt="현재 사진">`:'사진을 선택하면 여기에 표시됩니다.';hide('detailModal');show('plantModal')}

function deletePlant(){if(!confirm(`'${activePlant.name}' 식물과 모든 개화 기록을 삭제할까요? 이 작업은 되돌릴 수 없습니다.`))return;plants=plants.filter(p=>p.id!==activePlant.id);persist();hide('detailModal')}

render();
initCloud();
</script>
</body>
</html>
